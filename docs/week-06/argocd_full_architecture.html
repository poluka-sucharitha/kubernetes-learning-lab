<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Argo CD Full Architecture</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #a78bfa;
    margin-bottom: 6px;
    text-align: center;
  }
  p.subtitle {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 28px;
    text-align: center;
  }
  .card {
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 16px;
    padding: 24px;
    max-width: 760px;
    width: 100%;
    box-shadow: 0 4px 32px rgba(0,0,0,0.4);
  }
  svg text { font-family: 'Segoe UI', system-ui, sans-serif; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 20px;
    font-size: 12px;
    color: #94a3b8;
    padding-top: 16px;
    border-top: 1px solid #2d3148;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>
<body>
<h1>Argo CD Full Architecture</h1>
<p class="subtitle">SSO Login → RBAC → AppProject Guardrails → Kubernetes Deployment</p>
<div class="card">
<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Argo CD full architecture: SSO to Kubernetes deployment</title>
<desc>Flow from user login through SSO, Argo CD RBAC, AppProject guardrails, to actual Kubernetes deployment via the application controller</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Column headers -->
<text font-size="12" fill="#64748b" x="120" y="28" text-anchor="middle" font-weight="500">Identity</text>
<text font-size="12" fill="#64748b" x="340" y="28" text-anchor="middle" font-weight="500">Argo CD</text>
<text font-size="12" fill="#64748b" x="560" y="28" text-anchor="middle" font-weight="500">Kubernetes</text>

<!-- Dividers -->
<line x1="230" y1="15" x2="230" y2="600" stroke="#2d3148" stroke-width="0.5"/>
<line x1="450" y1="15" x2="450" y2="600" stroke="#2d3148" stroke-width="0.5"/>

<!-- IDENTITY COLUMN -->
<rect x="40" y="50" width="160" height="56" rx="8" fill="#0d3d38" stroke="#1d9e75" stroke-width="0.8"/>
<text font-size="13" fill="#9FE1CB" font-weight="500" x="120" y="74" text-anchor="middle">Entra ID / Okta</text>
<text font-size="11" fill="#5DCAA5" x="120" y="92" text-anchor="middle">Users + Groups</text>
<text font-size="11" fill="#475569" x="120" y="130" text-anchor="middle">e.g. PaymentsDeployers</text>

<!-- Arrow: Entra to argocd-cm -->
<line x1="200" y1="78" x2="258" y2="78" stroke="#1d9e75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text font-size="10" fill="#475569" x="229" y="70" text-anchor="middle">JWT + groups</text>

<!-- argocd-cm -->
<rect x="258" y="50" width="164" height="56" rx="8" fill="#1e1033" stroke="#7F77DD" stroke-width="0.8"/>
<text font-size="13" fill="#AFA9EC" font-weight="500" x="340" y="68" text-anchor="middle">argocd-cm</text>
<text font-size="11" fill="#7F77DD" x="340" y="86" text-anchor="middle">OIDC / SSO config</text>

<!-- Arrow down -->
<line x1="340" y1="106" x2="340" y2="154" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)"/>
<text font-size="10" fill="#475569" x="352" y="136" text-anchor="start">auth ok</text>

<!-- argocd-rbac-cm -->
<rect x="258" y="154" width="164" height="56" rx="8" fill="#1e1033" stroke="#7F77DD" stroke-width="0.8"/>
<text font-size="13" fill="#AFA9EC" font-weight="500" x="340" y="172" text-anchor="middle">argocd-rbac-cm</text>
<text font-size="11" fill="#7F77DD" x="340" y="190" text-anchor="middle">Global permissions</text>
<text font-size="10" fill="#475569" x="258" y="228" text-anchor="start">who can sync / view / manage</text>

<!-- Arrow down -->
<line x1="340" y1="210" x2="340" y2="258" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- AppProject -->
<rect x="258" y="258" width="164" height="56" rx="8" fill="#1e1600" stroke="#EF9F27" stroke-width="0.8"/>
<text font-size="13" fill="#FAC775" font-weight="500" x="340" y="276" text-anchor="middle">AppProject</text>
<text font-size="11" fill="#BA7517" x="340" y="294" text-anchor="middle">Guardrails</text>
<text font-size="10" fill="#475569" x="258" y="332" text-anchor="start">repo, namespace, resource whitelist</text>

<!-- Arrow down -->
<line x1="340" y1="314" x2="340" y2="362" stroke="#EF9F27" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Application -->
<rect x="258" y="362" width="164" height="56" rx="8" fill="#0a1e3d" stroke="#378ADD" stroke-width="0.8"/>
<text font-size="13" fill="#85B7EB" font-weight="500" x="340" y="380" text-anchor="middle">Application</text>
<text font-size="11" fill="#378ADD" x="340" y="398" text-anchor="middle">Deployment object</text>
<text font-size="10" fill="#475569" x="258" y="436" text-anchor="start">source + destination + syncPolicy</text>

<!-- Arrow to app-controller -->
<line x1="422" y1="390" x2="476" y2="390" stroke="#378ADD" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- KUBERNETES COLUMN - app-controller -->
<rect x="476" y="362" width="164" height="56" rx="8" fill="#1e1008" stroke="#D85A30" stroke-width="0.8"/>
<text font-size="13" fill="#F0997B" font-weight="500" x="558" y="376" text-anchor="middle">app-controller</text>
<text font-size="11" fill="#D85A30" x="558" y="394" text-anchor="middle">ServiceAccount</text>
<text font-size="10" fill="#475569" x="476" y="436" text-anchor="start">compares Git vs live, applies</text>

<!-- Arrow down to K8s API -->
<line x1="558" y1="418" x2="558" y2="466" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Kubernetes API -->
<rect x="476" y="466" width="164" height="56" rx="8" fill="#0d2010" stroke="#639922" stroke-width="0.8"/>
<text font-size="13" fill="#C0DD97" font-weight="500" x="558" y="484" text-anchor="middle">Kubernetes API</text>
<text font-size="11" fill="#639922" x="558" y="502" text-anchor="middle">EKS cluster</text>

<!-- Bottom callouts -->
<rect x="40" y="490" width="160" height="44" rx="6" fill="#0d3d38" stroke="#1d9e75" stroke-width="0.6"/>
<text font-size="12" fill="#9FE1CB" font-weight="500" x="120" y="507" text-anchor="middle">IAM + EKS entry</text>
<text font-size="11" fill="#5DCAA5" x="120" y="523" text-anchor="middle">kubectl access</text>

<rect x="258" y="490" width="164" height="44" rx="6" fill="#0d2010" stroke="#639922" stroke-width="0.6"/>
<text font-size="12" fill="#C0DD97" font-weight="500" x="340" y="507" text-anchor="middle">IRSA</text>
<text font-size="11" fill="#639922" x="340" y="523" text-anchor="middle">pod → AWS services</text>

<!-- Legend -->
<text font-size="10" fill="#475569" x="40" y="570">Created once:</text>
<rect x="40" y="578" width="10" height="10" rx="2" fill="#534AB7"/>
<text font-size="10" fill="#64748b" x="56" y="588">argocd-cm  argocd-rbac-cm</text>

<text font-size="10" fill="#475569" x="220" y="570">Per team / per app:</text>
<rect x="220" y="578" width="10" height="10" rx="2" fill="#BA7517"/>
<text font-size="10" fill="#64748b" x="236" y="588">AppProject</text>
<rect x="310" y="578" width="10" height="10" rx="2" fill="#185FA5"/>
<text font-size="10" fill="#64748b" x="326" y="588">Application</text>
</svg>

<div class="legend">
  <div class="legend-item"><div class="dot" style="background:#1d9e75"></div> Identity / Entra ID</div>
  <div class="legend-item"><div class="dot" style="background:#534AB7"></div> Argo CD platform config (once)</div>
  <div class="legend-item"><div class="dot" style="background:#BA7517"></div> AppProject (per team)</div>
  <div class="legend-item"><div class="dot" style="background:#185FA5"></div> Application (per microservice)</div>
  <div class="legend-item"><div class="dot" style="background:#D85A30"></div> Kubernetes runtime</div>
</div>
</div>
</body>
</html>
