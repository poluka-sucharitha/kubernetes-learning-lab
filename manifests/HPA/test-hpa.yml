# If Scaling Does Not Happen

Check:

```bash
kubectl top pods -n hpa-practice
kubectl describe hpa hpa-autoscaler -n hpa-practice
kubectl get pods -n hpa-practice
```

Common reasons:

* Metrics Server missing
* Low CPU usage
* Not enough load
* Short observation time

---

# How to Stop Load

Press:

```bash
Ctrl + C
```

BusyBox pod will be deleted automatically (`--rm` flag).

---

# Key Understanding

| Concept      | Meaning                 |
| ------------ | ----------------------- |
| HPA works on | CPU / Memory usage      |
| Not based on | Number of requests      |
| nginx issue  | Too lightweight         |
| Best testing | Use CPU-heavy workloads |

