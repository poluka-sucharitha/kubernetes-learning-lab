apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: gateway-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=hello from app2"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: app2-svc
  namespace: gateway-lab
spec:
  selector:
    app: app2
  ports:
    - port: 80
      targetPort: 5678
