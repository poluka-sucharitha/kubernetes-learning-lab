apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: gateway-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=hello from app1"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: app1-svc
  namespace: gateway-lab
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 5678
