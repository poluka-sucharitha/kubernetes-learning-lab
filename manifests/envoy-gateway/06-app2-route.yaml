apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app2-route
  namespace: gateway-lab
spec:
  parentRefs:
    - name: lab-gateway
  hostnames:
    - app2.lab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: app2-svc
          port: 80
