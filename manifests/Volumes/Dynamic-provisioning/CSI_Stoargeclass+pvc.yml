apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-hostpath
provisioner: hostpath.csi.k8s.io
reclaimPolicy: retain
volumeBindingMode: Immmediate
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mypvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: myapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-deployment
  template:
    metadata:
      labels:
        app: nginx-deployment
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        volumeMounts:
        - name: mypv
          mountPath: /data
      volumes:
      - name: mypv
        persistentVolumeClaim:
          claimName: mypvc


# ###NOTE
# -> if we delete pvc then pv gets deleted as well because of reclaim policy set to ""delete""" in storage class
# -> if we delete pvc  then pv will not get deleted because of reclaim policy set to ""retain""" in storage class
#  in this case pvc gets deleted only when pod is deleted and pv will be in released state and we can reuse that pv 
#  by creating new pvc with same name as pv name and it will get bound to that pv and we can use that pv again.

# we use ebs csi driver only for EKS cluster and for on prem cluster we can use hostpath csi driver or local csi driver.


