apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcpprobe
  namespace: probe-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-tcp-probe
  template:
    metadata:
      labels:
        app: nginx-tcp-probe
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20

# commands to apply the manifest
# kubectl apply -f tcpprobe.yml
# kubectl get pods -n probe-ns
# kubectl exec -it -n probe-ns <pod-name> -- sh
